# Self-contained crate: the empty [workspace] table makes this its own workspace
# root so it is never pulled into repocat's package build/release.
[workspace]

[package]
name = "bcl-repobot"
version = "0.1.0"
edition = "2024"
description = "GitHub App / bot identity CLI — mints an installation token and reviews PRs as the bot."
license = "MIT"
repository = "https://github.com/Battle-Creek-LLC/repocat"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["github", "bot", "app", "pull-request", "cli"]

# Published to crates.io as `bcl-repobot`; the installed binary stays `repobot`.
[[bin]]
name = "repobot"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# rust_crypto = pure-Rust RS256 backend (no OpenSSL/aws-lc C deps); default
# `use_pem` stays on for EncodingKey::from_rsa_pem. v10 requires picking a
# crypto provider explicitly or it panics at runtime.
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
anyhow = "1"

[dev-dependencies]
# Generate a throwaway RSA key in JWT unit tests — never the real App key.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
