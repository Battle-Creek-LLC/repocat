name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach binaries to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Tag-push runs can't rely on taiki-e/upload-rust-binary-action to *create*
  # the release (the repo's default workflow token is read-only per the repocat
  # baseline, and the action's create path 401s). Create it here first with an
  # explicit contents:write token; the upload jobs then only attach assets to an
  # existing release. Idempotent — a no-op if the release already exists.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Create release if missing
        # Pass context data through env vars (not inline ${{ }} in run:) to avoid
        # shell script injection — flagged by our own Semgrep code scanning.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --title "$TAG" --generate-notes --verify-tag

  upload-assets:
    needs: create-release
    name: ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build and upload archive
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: repocat
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          locked: true
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

  # Publish the crate to crates.io after the binaries build. Needs a
  # CARGO_REGISTRY_TOKEN repo secret (a crates.io API token). Mirrors the other
  # Battle-Creek-LLC crates (moot, ward); the dispatch `ref` override lets an
  # already-pushed tag be published after the secret is added.
  publish-crate:
    name: cargo publish
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
